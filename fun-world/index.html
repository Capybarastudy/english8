<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your Shift at Fun World</title>
<style>
/* Layout: a sunny amusement-park day. A ticket-style stamp card is the map of the learning path; every station is a booth. */
:root{
  --sky:#e9f6ff; --bg:#fff8ec; --ink:#23263a; --muted:#5f6478; --card:#ffffff; --hair:#e6e1d6;
  --red:#e8505b; --orange:#f08c00; --teal:#2a9d8f; --blue:#3a86ff; --violet:#6a4cc2; --yellow:#ffd23f;
  --good:#1f9d57; --good-bg:#e3f6ea; --bad:#d93a3a; --bad-bg:#fde8e8;
  --f-head:"Avenir Next","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --f-body:"Avenir Next","Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(var(--sky),var(--bg) 340px) var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-bottom:max(30px,env(safe-area-inset-bottom,0px));overflow-x:hidden}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto}
[hidden]{display:none!important}
.bar{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:calc(8px + env(safe-area-inset-top,0px)) 0 8px;background:linear-gradient(var(--sky) 75%,transparent)}
.brand{flex:1;min-width:160px;font-family:var(--f-head);font-weight:800;font-size:16px;color:var(--red);display:flex;align-items:center;gap:8px}
.pill{background:#fff;border:1.5px solid var(--hair);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center}
.stamps{display:flex;gap:4px}
.stamps i{width:24px;height:24px;border-radius:50%;border:2px dashed #c9c2b1;display:grid;place-items:center;font-style:normal;font-size:13px}
.stamps i.on{border:0;background:var(--c);color:#fff}
/* hero */
.hero{margin-top:6px;border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 6px 20px rgba(35,38,58,.08)}
.hero svg{display:block;width:100%;height:auto}
.hero .in{padding:18px 22px 22px;display:grid;gap:12px}
h1{font-family:var(--f-head);font-weight:900;font-size:clamp(30px,5vw,46px);line-height:1.05;margin:0;color:var(--red);text-wrap:balance}
.lead{margin:0;font-size:17px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.rule{background:#fff7e3;border-radius:14px;padding:10px 12px;display:flex;gap:10px;font-size:15px}
.rule .e{font-size:26px;line-height:1}
.rule b{display:block}
.field{display:flex;gap:10px;flex-wrap:wrap}
.field input{flex:1;min-width:200px;font:inherit;padding:12px 14px;border-radius:12px;border:2px solid #d8d1c0;background:#fff}
.btn{min-height:48px;padding:10px 20px;border-radius:14px;border:0;font-weight:800;background:var(--red);color:#fff;box-shadow:0 4px 0 #b2323c}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b2323c}
.btn.sec{background:#fff;color:var(--ink);box-shadow:0 4px 0 #d8d1c0;border:1.5px solid #d8d1c0}
.btn.go{background:var(--teal);box-shadow:0 4px 0 #1c6e64}
.btn[disabled]{opacity:.45;pointer-events:none}
/* stamp card */
.cardbox{margin-top:12px;background:#fff;border-radius:24px;padding:18px;box-shadow:0 6px 20px rgba(35,38,58,.08);position:relative}
.cardbox h2{font-family:var(--f-head);margin:0 0 4px;font-size:24px}
.cardbox p{margin:0 0 14px;color:var(--muted)}
.booths{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.booths{grid-template-columns:repeat(2,minmax(0,1fr))}}
.booth{position:relative;text-align:left;border:0;border-radius:18px;padding:0;background:var(--card);box-shadow:0 0 0 2px var(--hair);overflow:hidden;display:flex;flex-direction:column;min-height:170px}
.booth .roof{height:26px;background:repeating-linear-gradient(90deg,var(--c) 0 22px,#fff 22px 44px)}
.booth .b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.booth .no{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.booth .ic{font-size:32px;line-height:1.1}
.booth .t{font-family:var(--f-head);font-weight:800;font-size:17px}
.booth .s{font-size:13px;color:var(--muted)}
.booth .st{margin-top:auto;font-weight:800;font-size:13px;color:var(--c)}
.booth.locked{opacity:.5}
.booth.locked .ic{filter:grayscale(1)}
.booth.next{box-shadow:0 0 0 3px var(--c),0 8px 18px rgba(0,0,0,.08);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.stamp{position:absolute;right:8px;top:30px;width:60px;height:60px;border-radius:50%;border:3px solid var(--c);color:var(--c);display:grid;place-items:center;font-family:var(--f-head);font-weight:900;font-size:11px;text-align:center;line-height:1.05;transform:rotate(-14deg);background:rgba(255,255,255,.85)}
.bonusrow{margin-top:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bonushead{margin:16px 0 6px;font-weight:800;color:var(--violet)}
/* station */
.station{margin-top:12px;background:#fff;border-radius:24px;box-shadow:0 6px 20px rgba(35,38,58,.08);overflow:hidden}
.st-head{background:var(--c);color:#fff;padding:14px 18px;display:flex;gap:14px;align-items:center}
.st-head .ic{font-size:40px;line-height:1;background:#fff;border-radius:16px;width:58px;height:58px;display:grid;place-items:center}
.st-head .no{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.st-head h2{margin:0;font-family:var(--f-head);font-size:26px;line-height:1.1}
.st-awn{height:16px;background:repeating-linear-gradient(90deg,var(--c) 0 24px,#fff 24px 48px)}
.story{display:flex;gap:12px;align-items:center;padding:12px 18px;background:#fffaf0;border-bottom:1px solid var(--hair);font-size:16px}
.story .av{flex:none}
.dots{display:flex;gap:6px;padding:12px 18px 0}
.dots i{height:6px;flex:1;border-radius:4px;background:#ece6d8}
.dots i.on{background:var(--c)} .dots i.ok{background:var(--good)}
.task{padding:14px 18px 4px}
.intro{font-weight:800;margin:0 0 10px}
.q{padding:10px 0;border-bottom:1px solid var(--hair)}
.q:last-child{border-bottom:0}
.qt{font-weight:700;margin-bottom:8px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.opt{min-height:46px;text-align:left;padding:9px 14px;border-radius:12px;border:2px solid var(--hair);background:#fff;font-size:16px}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);font-weight:700}
.q.good .qt::after,.ln.good::after{content:" ✓";color:var(--good);font-weight:900}
.q.bad,.ln.bad{background:var(--bad-bg);border-radius:10px;padding-left:8px;padding-right:8px}
.ln{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 0;border-bottom:1px solid var(--hair)}
.ln .n{font-weight:800;color:var(--muted);width:24px}
.ln input{font:inherit;font-size:17px;padding:8px 10px;border-radius:10px;border:2px solid var(--hair);width:min(230px,100%);min-height:44px;background:#fffdf6}
.ln .qq{width:100%;font-weight:700;margin-left:30px}
.ordl{display:grid;gap:8px}
.oi{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--hair);border-radius:12px;padding:6px 8px 6px 12px;min-height:50px}
.oi .pos{flex:none;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px}
.oi .tx{flex:1}
.oi .mv{display:flex;gap:4px}
.oi .mv button{width:44px;height:40px;border-radius:10px;border:1.5px solid var(--hair);background:#faf7f0;font-size:18px}
.oi.good{border-color:var(--good);background:var(--good-bg)}
.oi.bad{border-color:var(--bad);background:var(--bad-bg)}
.words{display:flex;flex-wrap:wrap;gap:8px}
.wd{min-height:46px;padding:8px 16px;border-radius:999px;border:2px solid var(--hair);background:#fff;font-weight:700}
.wd.sel{background:var(--c);border-color:var(--c);color:#fff}
.wd.bad{background:var(--bad-bg);border-color:var(--bad);color:#8f1d1d}
.boardbox{margin:0 0 12px;border-radius:16px;overflow:auto;border:3px solid #23263a;background:#23263a}
.boardbox table{border-collapse:collapse;width:100%;min-width:520px;font-size:15px;color:#fff}
.boardbox th{background:#2f3350;color:var(--yellow);padding:8px 10px;text-align:left;font-family:var(--f-head)}
.boardbox td{padding:7px 10px;border-top:1px solid #3a3f5f;font-variant-numeric:tabular-nums}
.boardbox td:first-child{color:#aeb4d6;font-weight:700}
.boardbox .cap{background:var(--red);color:#fff;font-weight:900;letter-spacing:.12em;text-align:center;padding:5px;font-size:13px}
.mapbox{margin:0 0 12px;border-radius:16px;overflow:hidden;border:2px solid var(--hair);background:#cfeec0}
.mapbox svg{display:block;width:100%;height:auto}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 18px 18px}
.actions .sp{flex:1}
.fb{margin:10px 18px 0;padding:10px 14px;border-radius:12px;font-weight:700}
.fb.bad{background:var(--bad-bg);color:#8f1d1d}.fb.good{background:var(--good-bg);color:#14663a}.fb.info{background:#eef3ff;color:#23408f}
.hintbox{margin:10px 18px 0;padding:10px 14px;border-radius:12px;background:#fff4cf;color:#5a4300;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;font-weight:800;padding:12px 18px;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.bigstamp{position:fixed;inset:0;z-index:55;display:grid;place-items:center;pointer-events:none}
.bigstamp div{width:220px;height:220px;border-radius:50%;border:8px solid var(--c);color:var(--c);display:grid;place-items:center;text-align:center;font-family:var(--f-head);font-weight:900;font-size:26px;line-height:1.1;background:rgba(255,255,255,.92);animation:stampin .5s cubic-bezier(.2,1.6,.4,1) both;transform:rotate(-14deg)}
@keyframes stampin{0%{transform:scale(2.2) rotate(-14deg);opacity:0}100%{transform:scale(1) rotate(-14deg);opacity:1}}
@media (prefers-reduced-motion:reduce){.booth.next,.bigstamp div{animation:none}}
.cert{margin-top:12px;background:#fff;border-radius:24px;padding:26px 22px;text-align:center;border:6px double var(--yellow)}
.cert h2{font-family:var(--f-head);font-size:34px;margin:6px 0;color:var(--red)}
.cert .name{font-size:30px;font-weight:900}
.cert .stampline{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0}
.cert .stampline span{width:74px;height:74px;border-radius:50%;border:3px solid var(--c);color:var(--c);display:grid;place-items:center;font-weight:900;font-size:11px;transform:rotate(-10deg);line-height:1.1}
.roleplay{margin:14px auto 0;max-width:620px;text-align:left;background:#eef3ff;border-radius:16px;padding:12px 16px}
.roleplay b{color:#23408f}
#tBtn{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;min-height:44px;border-radius:12px;border:0;background:#0d6b5e;color:#fff;font-weight:800;padding:8px 14px}
.tpanel{position:fixed;inset:0;z-index:70;background:rgba(20,20,30,.7);display:grid;place-items:center;padding:16px}
.tpanel .in{background:#fff;border-radius:18px;max-width:720px;width:100%;max-height:86vh;overflow:auto;padding:18px}
.tpanel .sol{font-size:14px;background:#f6f3ea;border-radius:10px;padding:8px 12px;margin:6px 0}
.tpanel .row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.tpanel input{font:inherit;padding:10px;border-radius:10px;border:2px solid #ccc}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar" id="bar" hidden><div class="brand">🎡 Your shift at Fun World</div><div class="pill" id="who"></div><div class="pill"><span>Stamps</span><span class="stamps" id="stamps"></span></div></div>
  <main id="app"></main>
</div>
<button id="tBtn" hidden>Teacher</button>
<script>

id": "s2", "icon": "🗺️", "title": "Map point", "sub": "Give directions", "color": "#f08c00", "story": "Visitors are lost! You are at the entrance (★). Look at the map and help them.", "parts": [{"type": "mc", "intro": "Read the directions. Where do the visitors end up? Start at ★ every time.", "map": true, "hint": "Put your finger on ★ and follow the directions step by step. ‘Turn left’ means left from where you are walking.", "items": [{"q": "Go straight on up Main Street. At the fountain, turn right. It's on your left.", "opts": ["Ghost Train", "Ice cream", "Big Loop", "Toilets"]}, {"q": "Go straight on. Turn left at the fountain and walk over the bridge. It's on your right.", "opts": ["Big Wheel", "Snack bar", "Ghost Train", "Splash River"]}, {"q": "Turn left at the entrance and walk along Lake Path. It's at the end of the path.", "opts": ["Splash River", "Gift shop", "Big Loop", "Ice cream"]}, {"q": "Go straight on past the fountain to the end of Main Street. It's opposite the Big Loop.", "opts": ["Big Wheel", "Toilets", "Snack bar", "Gift shop"]}]}, {"type": "order", "intro": "A visitor wants to go to the snack bar. Put the directions in the right order.", "map": true, "hint": "From ★: first walk, then turn, then you see the snack bar.", "items": ["Turn right at the fountain.", "The snack bar is at the end, next to the toilets.", "Go straight on up Main Street.", "Walk past the ice cream stand."], "n": 4}]}, {"id": "s3", "icon": "🎢", "title": "Ride check", "sub": "Compare the rides", "color": "#2a9d8f", "story": "Your friends are coming next week. They want to know which rides to try. Compare the rides!", "parts": [{"type": "type", "intro": "Complete the sentences with the right form of the adjective. Use the board.", "board": true, "hint": "Short adjectives: -er / the -est. Long adjectives: more / the most. Same: as … as. Careful: good – better – the best!", "items": [{"q": "", "pre": "The Big Loop is", "post": "than the Splash River. (expensive)"}, {"q": "",   <div class="actions"><button class="btn sec" id="back">← Stamp card</button><span class="sp"></span><button class="btn sec" id="hb">💡 Hint</button><button class="btn go" id="chk">Check</button></div></section>`;
  const t=document.getElementById("task");
  let pre=(p.board?boardHTML():"")+(p.map?`<div class="mapbox">${mapSVG()}</div>`:"");
  ({mc:tMC,type:tType,order:tOrder,multi:tMulti})[p.type](t,p,pre);
  document.getElementById("back").onclick=()=>{view="card"; render();};
  document.getElementById("chk").onclick=()=>check(p);
  const showHint=()=>{document.getElementById("hint").innerHTML=`<div class="hintbox">💡 ${esc(p.hint)}</div>`; document.getElementById("hb").hidden=true;};
  document.getElementById("hb").onclick=()=>{S.hints[pk()]=true; save(); showHint();};
  if(S.hints[pk()]) showHint();
}
function fb(c,t){document.getElementById("fb").innerHTML=`<div class="fb ${c}" role="status">${t}</div>`;}
function tMC(el,p,pre){const d=draft(); d.a=d.a||[];
  el.innerHTML=pre+`<p class="intro">${esc(p.intro)}</p>`+p.items.map((it,i)=>`<div class="q" id="q${i}"><div class="qt">${i+1}. ${esc(it.q)}</div><div class="opts">${it.opts.map((o,j)=>`<button class="opt ${d.a[i]===j?"sel":""}" data-i="${i}" data-j="${j}" aria-pressed="${d.a[i]===j}">${esc(o)}</button>`).join("")}</div></div>`).join("");
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{d.a[+b.dataset.i]=+b.dataset.j; save(); const q=b.closest(".q"); q.className="q"; q.querySelectorAll(".opt").forEach(x=>{const on=x===b; x.classList.toggle("sel",on); x.setAttribute("aria-pressed",on);});});
}
function tType(el,p,pre){const d=draft(); d.a=d.a||[];
  el.innerHTML=pre+`<p class="intro">${esc(p.intro)}</p>`+p.items.map((it,i)=>`<div class="ln" id="q${i}"><span class="n">${i+1}</span>${it.q?`<span class="qq" style="margin-left:0">${esc(it.q)}</span><span class="n"></span>`:""}<span>${esc(it.pre)}</span><input id="t${i}" data-i="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(d.a[i]||"")}" aria-label="Gap ${i+1}"><span>${esc(it.post)}</span></div>`).join("");
  el.querySelectorAll("input").forEach(x=>x.oninput=()=>{d.a[+x.dataset.i]=x.value; x.closest(".ln").className="ln"; save();});
}
function tOrder(el,p,pre){const d=draft(); if(!d.o||d.o.length!==p.items.length) d.o=p.items.map((_,i)=>i);
  const draw=(marks)=>{el.innerHTML=pre+`<p class="intro">${esc(p.intro)}</p><div class="ordl">`+d.o.map((ix,k)=>`<div class="oi ${marks?marks[k]:""}"><span class="pos">${k+1}</span><span class="tx">${esc(p.items[ix])}</span><span class="mv"><button data-k="${k}" data-d="-1" aria-label="Move up" ${k===0?"disabled":""}>▲</button><button data-k="${k}" data-d="1" aria-label="Move down" ${k===d.o.length-1?"disabled":""}>▼</button></span></div>`).join("")+`</div>`;
    el.querySelectorAll(".mv button").forEach(b=>b.onclick=()=>{const k=+b.dataset.k, j=k+(+b.dataset.d); [d.o[k],d.o[j]]=[d.o[j],d.o[k]]; save(); draw();});};
  el._draw=draw; draw();
}
function tMulti(el,p,pre){const d=draft(); d.s=d.s||[];
  el.innerHTML=pre+`<p class="intro">${esc(p.intro)}</p><div class="words">`+p.words.map((w,i)=>`<button class="wd ${d.s.includes(i)?"sel":""}" data-i="${i}" aria-pressed="${d.s.includes(i)}">${esc(w)}</button>`).join("")+`</div>`;
  el.querySelectorAll(".wd").forEach(b=>b.onclick=()=>{const i=+b.dataset.i; d.s=d.s.includes(i)?d.s.filter(x=>x!==i):[...d.s,i]; save(); tMulti(el,p,pre);});
}
function check(p){
  const s=ST[cur], pi=S.part[s.id]||0, K=KEYS[cur][pi], d=draft(); let ok=0,total=0;
  if(p.type==="mc"){total=p.items.length; if(d.a.filter(x=>x!=null).length<total) return fb("info","Answer every question first.");
    p.items.forEach((_,i)=>{const g=d.a[i]===K[i]; ok+=g; document.getElementById("q"+i).className="q "+(g?"good":"bad");});}
  else if(p.type==="type"){total=p.items.length; if(p.items.some((_,i)=>!norm(d.a[i]))) return fb("info","Fill in every gap first.");
    p.items.forEach((_,i)=>{const g=K[i].map(norm).includes(norm(d.a[i])); ok+=g; document.getElementById("q"+i).className="ln "+(g?"good":"bad");});}
  else if(p.type==="order"){total=d.o.length; const marks=d.o.map((ix,k)=>ix===K[k]?"good":"bad"); ok=marks.filter(x=>x==="good").length; document.getElementById("task")._draw(marks);}
  else if(p.type==="multi"){total=p.words.length; p.words.forEach((_,i)=>{const sel=d.s.includes(i); if(sel===!!K[i]) ok++; else if(sel) document.querySelector(`.wd[data-i="${i}"]`).classList.add("bad");});
    if(ok<total){const miss=p.words.filter((_,i)=>K[i]&&!d.s.includes(i)).length; S.tries[pk()]=(S.tries[pk()]||0)+1; save(); return fb("bad",`Not yet! ${miss?`You've missed ${miss} word${miss>1?"s":""}.`:""} Red words don't mean ‘great’.`);}}
  S.tries[pk()]=(S.tries[pk()]||0)+1; save();
  if(ok<total) return fb("bad",`${ok} of ${total} correct. Look at the red ones and try again!`);
  if(pi<s.parts.length-1){S.part[s.id]=pi+1; save(); toast("✓ Well done! On to part "+(pi+2)+"."); renderStation(); scrollTo(0,0); return;}
  S.done[s.id]=true; save(); bigStamp(s); view="card"; render(); scrollTo(0,0);
}
function bigStamp(s){const o=document.createElement("div"); o.className="bigstamp"; o.style.setProperty("--c",s.color); o.innerHTML=`<div>${esc(s.title)}<br>✓ DONE</div>`; document.body.appendChild(o); setTimeout(()=>o.remove(),1400); toast(`🎉 You've got the ${s.title} stamp!`);}
function renderCert(){
  const date=new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
  app.innerHTML=`<section class="cert"><div style="font-size:42px" aria-hidden="true">🎡🎢🍔</div><div style="letter-spacing:.2em;font-weight:800;color:var(--muted)">CERTIFICATE</div>
  <h2>Employee of the Day</h2><div>Fun World is proud of</div><div class="name">${esc(S.name)}</div><div>for a great shift at the info desk, the map point, the ride check and the snack bar.</div>
  <div class="stampline">${ST.filter(s=>S.done[s.id]).map(s=>`<span style="--c:${s.color}">${esc(s.title).toUpperCase()}<br>✓</span>`).join("")}</div>
  <div style="color:var(--muted)">${esc(date)}</div>
  <div class="roleplay"><b>🎭 Now act it out!</b> Find two partners. A works at the snack bar, B and C are customers. Use your dialogue from station 4 – and add your own ideas (a different order, no small change, a complaint …).</div>
  <div class="actions" style="justify-content:center"><button class="btn sec" id="back">← Stamp card</button></div></section>`;
  document.getElementById("back").onclick=()=>{view="card"; render();};
}
/* teacher */
if(/[?&]teacher\b/.test(location.search)){const b=document.getElementById("tBtn"); b.hidden=false; b.onclick=teacher;}
let tOK=false;
function teacher(){const p=document.createElement("div"); p.className="tpanel"; const close=()=>p.remove();
  if(!tOK){p.innerHTML=`<div class="in"><h3>Teacher mode</h3><div class="row"><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric"><button class="btn go" id="ok">Open</button><button class="btn sec" id="x">Close</button></div><div id="m"></div></div>`; document.body.appendChild(p);
    p.querySelector("#x").onclick=close; p.querySelector("#ok").onclick=()=>{if(p.querySelector("#pin").value.trim()==="1985"){tOK=true; close(); teacher();} else p.querySelector("#m").textContent="Wrong PIN.";}; return;}
  const sol=dec(DATA.sol);
  p.innerHTML=`<div class="in"><h3>Teacher mode – solutions</h3><div class="row"><button class="btn go" id="skip">Stamp current station</button><button class="btn sec" id="rs">Reset this iPad</button><button class="btn sec" id="x">Close</button></div><div id="ra"></div>
  ${sol.map(s=>`<div class="sol"><b>${esc(s.title)}</b><br>${s.parts.map(x=>x.map(esc).join("<br>")).join("<hr>")}</div>`).join("")}</div>`;
  document.body.appendChild(p); p.querySelector("#x").onclick=close;
  p.querySelector("#skip").onclick=()=>{const i=ST.findIndex((s,k)=>unlocked(k)&&!S.done[s.id]); if(i<0) return; if(!S.started){S.started=true; S.name=S.name||"Teacher";} S.done[ST[i].id]=true; save(); close(); view="card"; render();};
  p.querySelector("#rs").onclick=()=>{p.querySelector("#ra").innerHTML=`<div class="row"><b>Delete all progress on this iPad?</b><button class="btn" id="y">Yes, reset</button></div>`; p.querySelector("#y").onclick=()=>{S=fresh(); try{localStorage.removeItem(KEY);}catch(e){} close(); view="start"; render();};};
}
view=S.started?"card":"start"; render();
</script>
