<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Escape from the Ghost Train</title>
<style>
/* Layout: a night-time amusement park. Neon signs carry the headings, light-bulb borders frame the doors, a roller coaster track links them on the map. */
:root{
  --night:#150c2c; --night2:#22123f; --panel:#2b1854; --panel2:#3a2370;
  --ink:#f6f1ff; --muted:#c2b5e6; --card:#fbf8ff; --card-ink:#1d1338; --card-muted:#5d5480; --hair:#ddd3f3;
  --pink:#ff4fa3; --cyan:#36e3d4; --yellow:#ffd23f; --orange:#ff9f43; --violet:#8b6cff;
  --good:#22a55b; --good-bg:#e2f7ea; --bad:#d93a3a; --bad-bg:#fde6e6;
  --f-head:"Avenir Next","Futura","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --f-body:"Avenir Next","Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,#3b1f73 0%,var(--night) 60%) fixed,var(--night);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-bottom:max(20px,env(safe-area-inset-bottom,0px));
  -webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto}
[hidden]{display:none!important}

/* top bar */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:calc(8px + env(safe-area-inset-top,0px)) 0 8px;background:linear-gradient(var(--night) 70%,transparent)}
.brand{font-family:var(--f-head);font-weight:800;letter-spacing:.04em;font-size:15px;color:var(--yellow);text-transform:uppercase;flex:1;min-width:150px}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid #4a3290;border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px;white-space:nowrap}
.pill .k{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
#clock{font-variant-numeric:tabular-nums;font-size:18px;color:var(--cyan)}
#clock.low{color:var(--orange)} #clock.over{color:var(--bad)}
.inv{display:flex;gap:4px}
.inv span{width:26px;height:30px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-head);font-weight:800;background:#1b1038;border:1px dashed #5b45a3;color:#6c5aa8;font-size:16px}
.inv span.got{background:var(--yellow);color:#3a2a00;border:0;box-shadow:0 0 10px rgba(255,210,63,.6)}

/* neon headings */
.neon{font-family:var(--f-head);font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#fff;text-shadow:0 0 6px var(--pink),0 0 18px var(--pink);margin:0;line-height:1.1;text-wrap:balance}
.neon.cyan{text-shadow:0 0 6px var(--cyan),0 0 18px var(--cyan)}

/* start */
.hero{background:var(--night2);border-radius:22px;overflow:hidden;border:1px solid #4a3290;margin-top:8px}
.hero svg{display:block;width:100%;height:auto}
.hero .in{padding:20px 22px 24px;display:grid;gap:14px}
.story{font-size:17px;color:var(--ink)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.rule{background:var(--panel);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;font-size:15px}
.rule b{display:block;color:var(--yellow)}
.rule .e{font-size:26px;line-height:1}
.field{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field input{flex:1;min-width:200px;font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid #5b45a3;background:#1b1038;color:var(--ink)}
.btn{min-height:48px;padding:10px 20px;border-radius:14px;border:0;font-weight:800;font-size:17px;background:var(--pink);color:#fff;box-shadow:0 4px 0 #b02a6e}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b02a6e}
.btn.sec{background:var(--panel2);box-shadow:0 4px 0 #22124a;color:var(--ink)}
.btn.cy{background:var(--cyan);color:#0b2b2a;box-shadow:0 4px 0 #1a9a90}
.btn[disabled]{opacity:.45;pointer-events:none}

/* map */
.mapbox{margin-top:10px;background:var(--night2);border:1px solid #4a3290;border-radius:22px;padding:16px;position:relative;overflow:hidden}
.mapbox h2{margin-bottom:4px}
.mapbox p{margin:0 0 12px;color:var(--muted)}
.track{position:absolute;inset:auto 0 0 0;height:120px;opacity:.35;pointer-events:none}
.doors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;position:relative}
@media (max-width:820px){.doors{grid-template-columns:repeat(2,minmax(0,1fr))}}
.door{position:relative;min-height:150px;border-radius:18px;padding:14px 12px 12px;background:var(--panel);border:2px solid #4a3290;color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:4px}
.door .no{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.door .ic{font-size:34px;line-height:1.1}
.door .t{font-family:var(--f-head);font-weight:800;font-size:17px;line-height:1.15}
.door .s{font-size:13px;color:var(--muted)}
.door .st{margin-top:auto;font-size:13px;font-weight:800}
.door.open{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,210,63,.25),0 0 22px rgba(255,79,163,.35);animation:pulse 2.4s ease-in-out infinite}
.door.open .st{color:var(--yellow)}
.door.done{background:#1f3b34;border-color:#2f8f73}
.door.done .st{color:var(--cyan)}
.door.locked{opacity:.55}
.door.locked .ic{filter:grayscale(1)}
.door .lt{position:absolute;right:10px;top:10px;width:34px;height:38px;border-radius:8px;background:var(--yellow);color:#3a2a00;font-family:var(--f-head);font-weight:900;font-size:22px;display:grid;place-items:center}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,210,63,.15),0 0 30px rgba(255,79,163,.55)}}
@media (prefers-reduced-motion:reduce){.door.open{animation:none}}

/* door screen */
.room{margin-top:10px;background:var(--night2);border:1px solid #4a3290;border-radius:22px;overflow:hidden}
.room-head{display:flex;gap:14px;align-items:center;padding:16px 18px;background:linear-gradient(90deg,#3a1f6e,#22123f)}
.room-head .ic{font-size:44px;line-height:1}
.room-head .no{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--yellow);text-transform:uppercase}
.room-head h2{font-size:26px}
.room-head .sub{color:var(--muted);font-size:15px}
.room-story{padding:12px 18px;font-style:italic;color:var(--muted);border-bottom:1px solid #3d2a75;display:flex;gap:10px;align-items:center}
.room-story svg{flex:none}
.steps{display:flex;gap:6px;padding:12px 18px 0}
.steps i{height:6px;flex:1;border-radius:4px;background:#3d2a75}
.steps i.on{background:var(--pink)} .steps i.ok{background:var(--cyan)}
.task{margin:12px 12px 0;background:var(--card);color:var(--card-ink);border-radius:18px;padding:16px 16px 18px;position:relative}
.task .intro{font-weight:700;margin:0 0 12px}
.task .intro small{display:block;font-weight:400;color:var(--card-muted);margin-top:4px}
.actions{display:flex;gap:10px;flex-wrap:wrap;padding:14px 12px 16px;align-items:center}
.actions .sp{flex:1}
.fb{margin:10px 12px 0;padding:10px 14px;border-radius:12px;font-weight:700}
.fb.bad{background:var(--bad-bg);color:#8f1d1d}
.fb.good{background:var(--good-bg);color:#14663a}
.fb.info{background:#efe9ff;color:#3a2a7a}
.hintbox{margin:10px 12px 0;padding:10px 14px;border-radius:12px;background:#fff4cf;color:#5a4300;font-size:15px}
.hintbox b{color:#8a5a00}

/* task widgets */
.q{padding:10px 0;border-bottom:1px solid var(--hair)}
.q:last-child{border-bottom:0}
.q .qt{font-weight:700;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opts.row{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{min-height:46px;text-align:left;padding:10px 14px;border-radius:12px;border:2px solid var(--hair);background:#fff;color:var(--card-ink);font-size:16px}
.opt.sel{border-color:var(--violet);background:#efe9ff;font-weight:700}
.rwn{display:grid;grid-template-columns:28px 1fr auto;gap:8px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--hair)}
.rwn .n{font-weight:800;color:var(--card-muted)}
.rwn .b3{display:flex;gap:6px}
.rwn .b3 button{min-width:56px;min-height:44px;border-radius:10px;border:2px solid var(--hair);background:#fff;font-weight:800;font-size:14px;color:var(--card-ink)}
.rwn .b3 button.sel[data-v="0"]{background:#dff5ea;border-color:var(--good);color:#14663a}
.rwn .b3 button.sel[data-v="1"]{background:#fde6e6;border-color:var(--bad);color:#8f1d1d}
.rwn .b3 button.sel[data-v="2"]{background:#fff1d6;border-color:var(--orange);color:#7a4a00}
@media (max-width:640px){.rwn{grid-template-columns:24px 1fr}.rwn .b3{grid-column:2}}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;margin-bottom:6px;color:var(--card-muted)}
.legend b{color:var(--card-ink)}
.tr{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,260px);gap:6px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--hair)}
.tr .n{font-weight:800;color:var(--card-muted)}
.tr .ln{font-size:13px;color:#7a4a00;font-weight:700}
.tr input,.chat input,.final input{font:inherit;font-size:17px;padding:10px 12px;border-radius:10px;border:2px solid var(--hair);width:100%;min-height:46px;background:#fff;color:var(--card-ink)}
.tr input::placeholder{color:#a79fc4;letter-spacing:.12em}
@media (max-width:640px){.tr{grid-template-columns:24px 1fr}.tr input{grid-column:2}}
textarea{font:inherit;font-size:17px;width:100%;min-height:96px;padding:10px 12px;border-radius:12px;border:2px solid var(--hair);resize:vertical;color:var(--card-ink);background:#fff}

/* chips + slots */
.pool{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-radius:14px;background:#f1ecff;border:2px dashed #cfc3f2;min-height:62px;margin-top:12px}
.pool.stick{position:sticky;bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:5;max-height:42vh;overflow:auto;background:#f1ecffee;box-shadow:0 -6px 16px rgba(29,19,56,.18)}
.pool .lbl{width:100%;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--card-muted);text-transform:uppercase}
.chip{touch-action:none;user-select:none;-webkit-user-select:none;min-height:44px;padding:9px 14px;border-radius:12px;background:#fff;border:2px solid #b8a8ee;color:var(--card-ink);font-weight:700;font-size:15px;box-shadow:0 2px 0 #cfc3f2;text-align:left}
.chip.sel{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,79,163,.3)}
.chip.ex{background:#eee;border-color:#ccc;color:#777;box-shadow:none}
.slotrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--hair)}
.slotrow .rl{font-weight:700}
.slotrow.ex .rl{color:#888}
.slot{min-height:50px;border-radius:12px;border:2px dashed #b8a8ee;background:#faf8ff;display:flex;align-items:center;padding:3px}
.slot.hot{border-color:var(--pink);background:#fff0f7}
.slot .chip{width:100%}
.slot .ph{color:#a79fc4;font-size:14px;padding:0 10px}
@media (max-width:640px){.slotrow{grid-template-columns:1fr}}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.zone{border-radius:16px;padding:10px;min-height:190px;display:flex;flex-direction:column;gap:8px;border:2px dashed}
.zone h4{margin:0;font-family:var(--f-head);font-size:15px;letter-spacing:.04em}
.zone.up{background:#e6f8ef;border-color:#5ccf91} .zone.up h4{color:#14663a}
.zone.down{background:#fde9ec;border-color:#f08a96} .zone.down h4{color:#8f1d1d}
.zone.hot{outline:3px solid var(--pink)}
@media (max-width:640px){.zones{grid-template-columns:1fr}}
.ghost-drag{position:fixed;z-index:100;pointer-events:none;opacity:.92;transform:translate(-50%,-50%) rotate(-2deg);box-shadow:0 10px 24px rgba(0,0,0,.35)}

/* chat */
.chat{background:#e9f0e6;border-radius:16px;padding:12px;display:grid;gap:10px}
.msg{max-width:92%;padding:8px 12px 10px;border-radius:14px;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.08);line-height:1.6}
.msg.me{justify-self:end;background:#d9f2c8}
.msg .who{display:block;font-size:12px;font-weight:800;color:#b0491c}
.msg.me .who{color:#2f7d3a}
.msg input{display:inline-block;width:min(290px,100%);min-height:40px;padding:6px 10px;margin:2px 0;font-size:16px;vertical-align:middle}
.box{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.box span{background:#efe9ff;color:#3a2a7a;border-radius:10px;padding:4px 10px;font-size:14px;font-weight:700}

/* lock overlay */
.lock{position:fixed;inset:0;z-index:50;background:rgba(10,4,24,.82);display:grid;place-items:center;padding:20px;text-align:center}
.lock .in{max-width:420px;display:grid;gap:10px;justify-items:center}
.lock .big{font-size:56px;font-weight:900;font-family:var(--f-head);color:var(--yellow);font-variant-numeric:tabular-nums}
.flicker{animation:flick 1.2s infinite}
@keyframes flick{0%,100%{opacity:1}45%{opacity:.4}50%{opacity:1}55%{opacity:.2}60%{opacity:1}}
@media (prefers-reduced-motion:reduce){.flicker{animation:none}}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--yellow);color:#3a2a00;font-weight:800;padding:12px 18px;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.35);max-width:90vw;text-align:center}

/* final + cert */
.final .letters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.final .letters span{width:46px;height:54px;border-radius:10px;background:var(--yellow);color:#3a2a00;display:grid;place-items:center;font-family:var(--f-head);font-weight:900;font-size:28px}
.cert{margin-top:10px;background:#fffaf0;color:#2a1d10;border-radius:22px;padding:26px 22px;text-align:center;border:6px double #d4a72c;position:relative;overflow:hidden}
.cert h2{font-family:var(--f-head);font-size:34px;margin:6px 0;color:#7a1f5a;text-wrap:balance}
.cert .team{font-size:30px;font-weight:900;color:#2a1d10;margin:6px 0}
.cert .stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:14px 0}
.cert .stats div{background:#fff;border:2px solid #ecd9a6;border-radius:14px;padding:8px 14px;min-width:130px}
.cert .stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.cert textarea{max-width:640px;margin:8px auto 0;display:block;text-align:left}
.cert .small{font-size:14px;color:#6b5a3a}

/* teacher */
#tBtn{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;min-height:44px;border-radius:12px;border:0;background:#0d6b5e;color:#fff;font-weight:800;padding:8px 14px}
.tpanel{position:fixed;inset:0;z-index:70;background:rgba(10,4,24,.85);display:grid;place-items:center;padding:16px}
.tpanel .in{background:#fff;color:#1d1338;border-radius:18px;max-width:720px;width:100%;max-height:86vh;overflow:auto;padding:18px}
.tpanel h3{margin:0 0 8px}
.tpanel .sol{font-size:14px;background:#f4f1fb;border-radius:10px;padding:8px 12px;margin:6px 0}
.tpanel .sol b{display:block}
.tpanel .row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar" id="bar" hidden>
    <div class="brand">👻 Escape from the Ghost Train</div>
    <div class="pill"><span class="k">Park closes</span><span id="clock">60:00</span></div>
    <div class="pill"><span class="k">Hints</span><span id="hints">💡💡💡</span></div>
    <div class="pill inv" id="inv"></div>
  </div>
  <main id="app"></main>
</div>
<button id="tBtn" hidden>Teacher</button>

<script>

    for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3), s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10); w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;}
    let [a,b,c,d,e,f,g,hh]=h;
    for(let i=0;i<64;i++){const S1=r(e,6)^r(e,11)^r(e,25), ch=(e&f)^(~e&g), t1=(hh+S1+ch+K[i]+w[i])>>>0, S0=r(a,2)^r(a,13)^r(a,22), mj=(a&b)^(a&c)^(b&c), t2=(S0+mj)>>>0;
      hh=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;}
    h=[(h[0]+a)>>>0,(h[1]+b)>>>0,(h[2]+c)>>>0,(h[3]+d)>>>0,(h[4]+e)>>>0,(h[5]+f)>>>0,(h[6]+g)>>>0,(h[7]+hh)>>>0];
  }
  return h.map(x=>x.toString(16).padStart(8,"0")).join("");
}
const H = (...p)=>sha256([DATA.salt,...p].join("|")).slice(0,24);
function norm(s,strip){
  s=String(s||"").toLowerCase().replace(/[’‘`´]/g,"'").trim().replace(/\s+/g," ").replace(/[.!?,;:]+$/,"").trim();
  if(strip) s=s.replace(/^(a|an|the|to) /,"");
  return s;
}

function taskSlots(el,st){

/* zones: many chips per zone */
function taskZones(el,st){

  let html=`<p class="intro">${esc(st.intro)}<small>Drag a card into UP or DOWN – or tap a card, then tap UP or DOWN.</small></p><div class="zones">`+

/* drag with pointer events + tap alternative */
function wireDnD(el,place,rerender){
  el.querySelectorAll("[data-chip]").forEach(c=>{
    c.addEventListener("pointerdown",ev=>{
      if(ev.button>0) return;
      const id=c.dataset.chip, sx=ev.clientX, sy=ev.clientY; let ghost=null, hot=null;
      c.setPointerCapture&&c.setPointerCapture(ev.pointerId);
      const move=e=>{
        if(!ghost&&Math.hypot(e.clientX-sx,e.clientY-sy)>8){ghost=c.cloneNode(true); ghost.classList.add("ghost-drag"); ghost.style.width=c.offsetWidth+"px"; document.body.appendChild(ghost); c.style.opacity=".35";}
        if(ghost){ghost.style.left=e.clientX+"px"; ghost.style.top=e.clientY+"px";
          const t=document.elementFromPoint(e.clientX,e.clientY); const d=t&&t.closest("[data-drop]");
          if(hot&&hot!==d) hot.classList.remove("hot"); if(d&&d.dataset.drop!=="pool"){d.classList.add("hot");} hot=d;}
      };
      const up=e=>{
        c.removeEventListener("pointermove",move); c.removeEventListener("pointerup",up); c.removeEventListener("pointercancel",up);
        if(ghost){ghost.remove(); c.style.opacity=""; if(hot) hot.classList.remove("hot");
          const t=document.elementFromPoint(e.clientX,e.clientY); const d=t&&t.closest("[data-drop]");
          if(d&&el.contains(d)) place(id,d); else rerender();
        } else { // tap
          if(c.closest(".slot")||c.closest(".zone")){ if(sel===id){place(id,null);} else {sel=id; rerender();} }
          else {sel=(sel===id?null:id); rerender();}
        }
      };
      c.addEventListener("pointermove",move); c.addEventListener("pointerup",up); c.addEventListener("pointercancel",up);
    });
  });
  el.querySelectorAll("[data-drop]").forEach(d=>d.addEventListener("click",e=>{
    if(e.target.closest("[data-chip]")) return;
    if(sel){place(sel,d.dataset.drop==="pool"?null:d);}
  }));
}

/* ---------- checking ---------- */
function check(st){
  if(S.lockUntil>Date.now()) return;
  const d=DATA.doors[S.door], dr=draft(); let ok=0, total=0, incomplete=false;
  const id=d.id, si=S.step;
  if(st.type==="mc"||st.type==="rwn"){total=st.items.length; st.items.forEach((it,i)=>{if(dr.a==null||dr.a[i]==null) incomplete=true; else if(H(id,si,i,dr.a[i])===it.h) ok++;});}
  else if(st.type==="type"){total=st.items.length; st.items.forEach((it,i)=>{const v=norm(dr.a&&dr.a[i],true); if(!v) incomplete=true; else if(it.h.includes(H(id,si,i,v))) ok++;});}
  else if(st.type==="chat"){total=st.items.length; st.items.forEach((it,i)=>{const v=norm(dr.a&&dr.a[i]); if(!v) incomplete=true; else if(it.h.includes(H(id,si,i,v))) ok++;});}
  else if(st.type==="slots"){total=st.rows.length; st.rows.forEach((r,i)=>{const c=dr.p&&dr.p[i]; if(!c) incomplete=true; else if(H(id,si,i,c)===st.h[i]) ok++;});}
  else if(st.type==="zones"){total=st.chips.length; st.chips.forEach(c=>{const z=dr.z&&dr.z[c.id]; if(z===undefined) incomplete=true; else if(H(id,si,c.id,z)===st.h[c.id]) ok++;});}
  else if(st.type==="guess"){const words=(S.guess||"").trim().split(/\s+/).filter(Boolean).length; if(words<3){fb("info","Write a short guess first (at least a few words)."); return;} return stepDone();}
  if(incomplete){fb("info","Answer everything first – then press Check."); return;}
  if(ok===total) return stepDone();
  S.remaining-=PENALTY; S.lockUntil=Date.now()+LOCK_MS; save();
  fb("bad",`${ok} of ${total} correct. The lights flicker … −30 seconds!`);
  openLock();
}
function stepDone(){
  const d=DATA.doors[S.door];
  S.stepsDone[stepKey()]=true; sel=null;
  if(S.step<d.steps.length-1){S.step++; save(); render(); window.scrollTo(0,0); toast("✓ Correct! On to part "+(S.step+1)+"."); return;}
  S.letters[S.door]=d.letter; S.door++; S.step=0; save();
  view="map"; render(); window.scrollTo(0,0);
  toast(`🔓 Door ${S.door} is open! You found the letter “${d.letter}”.`,4000);
}
function openLock(){
  if(document.getElementById("lockLeft")) return;
  const o=document.createElement("div"); o.className="lock"; o.id="lockOv";
  o.innerHTML=`<div class="in"><div class="flicker">${ghostSVG(90)}</div><div style="font-weight:800;font-size:20px">The lights are out!</div><div style="color:var(--muted)">Check your answers in the book while you wait.</div><div class="big" id="lockLeft">15 s</div></div>`;
  document.body.appendChild(o);
}
function closeLock(){const o=document.getElementById("lockOv"); if(o) o.remove();}

/* ---------- final + certificate ---------- */
function renderFinal(){
  const k="final";
  app.innerHTML=`<section class="room"><div class="room-head"><span class="ic">🚪</span><div><div class="no">Exit</div><h2 class="neon" style="font-size:24px">${esc(DATA.final.title)}</h2><div class="sub">The last lock</div></div></div>
  <div class="room-story">${ghostSVG(34)}<span>The ghost whispers: “Tim's report ends with a word that will stay with him … Type it and you are free!”</span></div>
  <div class="task final"><p class="intro">${esc(DATA.final.intro)}</p><div class="letters">${S.letters.map(l=>`<span>${l}</span>`).join("")}</div>
  <label for="code" style="font-weight:700">Code word</label><input id="code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="_ _ _ _ _ _ _"></div>
  <div id="hintArea">${S.hintUsed[k]?`<div class="hintbox"><b>💡 Hint:</b> ${esc(DATA.final.hint)}</div>`:""}</div><div id="fbArea"></div>
  <div class="actions"><button class="btn sec" id="back">← Map</button><span class="sp"></span><button class="btn sec" id="hintBtn" ${S.hintUsed[k]||S.hintsLeft<=0?"hidden":""}>💡 Hint (−1 min)</button><button class="btn cy" id="check">Escape!</button></div></section>`;
  document.getElementById("back").onclick=()=>{view="map"; render();};
  const hb=document.getElementById("hintBtn"); hb.onclick=()=>{if(S.hintsLeft<=0) return; S.hintsLeft--; S.hintUsed[k]=true; S.remaining-=HINT_COST; save(); render();};
  const inp=document.getElementById("code");
  document.getElementById("check").onclick=()=>{
    if(S.lockUntil>Date.now()) return;
    const v=norm(inp.value); if(!v){fb("info","Type the code word first."); return;}
    if(DATA.final.h.includes(H("final",0,0,v))){S.finished=true; S.finishRemaining=S.remaining; save(); view="cert"; render(); window.scrollTo(0,0); return;}
    S.remaining-=PENALTY; S.lockUntil=Date.now()+LOCK_MS; save(); fb("bad","That's not the code word. −30 seconds!"); openLock();
  };
  inp.onkeydown=e=>{if(e.key==="Enter") document.getElementById("check").click();};
  if(S.lockUntil>Date.now()) openLock();
}
function renderCert(){
  const ms=S.finishRemaining, over=ms<0, used=MAX_HINTS-S.hintsLeft;
  const date=new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
  app.innerHTML=`<section class="cert">
    <div style="display:flex;justify-content:center;gap:10px;font-size:40px" aria-hidden="true">🎢 👻 🎡</div>
    <div class="small" style="letter-spacing:.2em;text-transform:uppercase;font-weight:800">Certificate</div>
    <h2>Ghost Train Survivors</h2>
    <div class="small">This is to certify that the team</div>
    <div class="team">${esc(S.team)}</div>
    <div class="small">escaped from the ghost train and knows Tim's roller coaster year inside out!</div>
    <div class="stats"><div>${over?"Overtime":"Time left"}<b>${fmt(Math.abs(ms))}</b></div><div>Hints used<b>${used} of ${MAX_HINTS}</b></div><div>Date<b style="font-size:16px">${esc(date)}</b></div></div>
    <p style="font-weight:700;margin:16px 0 0">One last question (not marked):</p>
    <p class="small" style="margin:4px 0 0">Would <i>you</i> like to work at an amusement park in a gap year? Why (not)? Write two sentences.</p>
    <textarea id="refl" maxlength="500" placeholder="I would / wouldn't like to … because …">${esc(S.reflection)}</textarea>
    <p class="small" style="margin-top:12px">📸 Take a screenshot of this certificate and show it to your teacher.</p>
  </section>`;
  document.getElementById("refl").oninput=e=>{S.reflection=e.target.value; save();};
}

/* ---------- teacher mode (?teacher) ---------- */
function decodeSol(){const key="capybara-ghost"; const b=atob(DATA.sol); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i)^key.charCodeAt(i%key.length); return JSON.parse(new TextDecoder().decode(u));}
let teacherOK=false;
if(/[?&]teacher\b/.test(location.search)){
  const tb=document.getElementById("tBtn"); tb.hidden=false; tb.onclick=openTeacher;
}
function openTeacher(){
  const p=document.createElement("div"); p.className="tpanel";
  const close=()=>{p.remove();};
  if(!teacherOK){
    p.innerHTML=`<div class="in"><h3>Teacher mode</h3><label for="pin">PIN</label><div class="row"><input id="pin" inputmode="numeric" type="password" style="font:inherit;padding:10px;border-radius:10px;border:2px solid #ccc"><button class="btn cy" id="pinGo">Open</button><button class="btn sec" id="pinX">Close</button></div><div id="pinMsg"></div></div>`;
    document.body.appendChild(p);
    p.querySelector("#pinX").onclick=close;
    p.querySelector("#pinGo").onclick=()=>{if(H("pin",0,0,p.querySelector("#pin").value.trim())===DATA.pinH){teacherOK=true; close(); openTeacher();} else p.querySelector("#pinMsg").textContent="Wrong PIN.";};
    return;
  }
  const sol=decodeSol();
  p.innerHTML=`<div class="in"><h3>Teacher mode – solutions</h3>
    <div class="row"><button class="btn cy" id="skip">Open current door</button><button class="btn sec" id="reset">Reset game</button><button class="btn sec" id="tx">Close</button></div>
    <div id="resetAsk"></div>
    ${sol.map((d,i)=>`<div class="sol"><b>${i<7?"Door "+(i+1)+": ":""}${esc(d.door)} ${d.letter?"→ letter "+d.letter:""}</b>${d.steps.map(s=>s.map(x=>esc(x)).join("<br>")).join("<hr>")}</div>`).join("")}</div>`;
  document.body.appendChild(p);
  p.querySelector("#tx").onclick=close;
  p.querySelector("#skip").onclick=()=>{
    if(!S.started){S.started=true; S.team=S.team||"Teacher";}
    if(S.door<DATA.doors.length){S.letters[S.door]=DATA.doors[S.door].letter; S.door++; S.step=0; S.lockUntil=0; closeLock(); save(); view="map"; close(); render();}
  };
  p.querySelector("#reset").onclick=()=>{
    p.querySelector("#resetAsk").innerHTML=`<div class="row" style="align-items:center"><b>Really reset? All progress on this iPad is deleted.</b><button class="btn" id="rYes">Yes, reset</button></div>`;
    p.querySelector("#rYes").onclick=()=>{S=fresh(); try{localStorage.removeItem(KEY);}catch(e){} closeLock(); close(); view="start"; render();};
  };
}

/* ---------- boot ---------- */
if(S.started&&!S.finished) view="map";
render();
</script>
